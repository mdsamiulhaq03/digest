services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: digest
      POSTGRES_PASSWORD: digest
      POSTGRES_DB: digest
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digest -d digest"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # Postgres is the record of every job; Redis only carries ids to wake the
    # worker, so there is nothing here worth persisting to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # One-click demo logins on the login page. On for this local stack only;
      # the setting defaults to off everywhere else.
      DEMO_ACCOUNTS: "true"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - uploads:/data/uploads
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Readiness, not liveness: the worker and web wait on this, and they need
    # an API that can reach Postgres, not merely a running process.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - uploads:/data/uploads
    # Same image as app, different process. The image's entrypoint runs
    # migrations; skipping it here means only one container ever migrates, and
    # waiting for app to be healthy means they have finished before we start.
    entrypoint: ["python"]
    command: ["-m", "app.worker"]
    restart: unless-stopped
    # On `docker compose stop`, the worker finishes the job it holds before
    # exiting. This is how long Docker waits before resorting to SIGKILL.
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image's healthcheck probes :8000/health/live, which only the API serves.
    healthcheck:
      disable: true

  web:
    # The production build. For frontend work run `npm run dev` on the host
    # instead: hot reload doesn't survive Docker Desktop's file sharing.
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side only: the browser talks to Next.js, and Next.js calls the
      # API over the Compose network.
      API_URL: http://app:8000
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  uploads: